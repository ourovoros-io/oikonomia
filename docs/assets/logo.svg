<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Oikonomia logo">
  <defs>
    <linearGradient id="oik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d97ff"/>
      <stop offset="1" stop-color="#5a51f0"/>
    </linearGradient>
  </defs>

  <!-- Pediment: the roof of the oikos -->
  <path d="M 92 196 L 256 88 L 420 196"
        fill="none" stroke="url(#oik)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two columns (double-entry) carved from one slab; the void between
       them is a keyhole doorway (the encrypted vault) -->
  <path fill-rule="evenodd" fill="url(#oik)" d="
    M 152 232
    L 360 232
    Q 388 232 388 260
    L 388 398
    Q 388 412 374 412
    L 286 412
    L 286 352
    Q 298 336 298 316
    A 42 42 0 1 0 214 316
    Q 214 336 226 352
    L 226 412
    L 138 412
    Q 124 412 124 398
    L 124 260
    Q 124 232 152 232
    Z"/>

  <!-- Stylobate: the base every account stands on -->
  <rect x="100" y="436" width="312" height="44" rx="22" fill="url(#oik)"/>
</svg>
