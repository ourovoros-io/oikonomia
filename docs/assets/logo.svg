<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Oikonomia logo">
  <defs>
    <linearGradient id="oik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- The shield (SQLCipher encryption) wraps everything the house holds -->
  <g transform="translate(-20 -23.4) scale(23)">
    <path fill="none" stroke="url(#oik)" stroke-width="1.2"
          stroke-linecap="round" stroke-linejoin="round"
          d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
  </g>

  <!-- The oikos inside: pediment, two columns around a keyhole doorway,
       stylobate base, and a euro at the vault door -->
  <g transform="translate(256 240) scale(0.56) translate(-256 -238)">
    <path d="M 92 196 L 256 88 L 420 196"
          fill="none" stroke="url(#oik)" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path fill-rule="evenodd" fill="url(#oik)" d="
      M 152 232
      L 360 232
      Q 388 232 388 260
      L 388 398
      Q 388 412 374 412
      L 286 412
      L 286 352
      Q 298 336 298 316
      A 42 42 0 1 0 214 316
      Q 214 336 226 352
      L 226 412
      L 138 412
      Q 124 412 124 398
      L 124 260
      Q 124 232 152 232
      Z"/>

    <rect x="100" y="436" width="312" height="44" rx="22" fill="url(#oik)"/>

    <!-- The coin at the keyhole (single path so the gradient bbox stays 2D) -->
    <path fill="none" stroke="url(#oik)" stroke-width="11.5" stroke-linecap="round"
          d="M 273 297.7 A 25 25 0 1 0 273 334.3 M 226 310.2 H 258 M 226 321.8 H 258"/>
  </g>
</svg>
