[workspace]
resolver = "2"
members = [
    "crates/oikonomia-core",
    "crates/oikonomia-update",
    "crates/macos-dock-icon",
    "apps/desktop/src-tauri",
]
default-members = ["crates/oikonomia-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/ourovoros-io/oikonomia"
rust-version = "1.94"
license = "GPL-3.0-or-later"

[workspace.dependencies]
oikonomia-core = { path = "crates/oikonomia-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros", "local-offset"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
argon2 = "0.5"
rand = "0.10"
directories = "6.0"
base64 = "0.23"
csv = "1.3"
tempfile = "3.14"
# Exact: documents/pdf_nesting.rs mirrors how this release resolves forms
# and page resources, so a new release must be reviewed against it first.
pdf-extract = "=0.12.1"
ocrs = "0.13"
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
