[package]
name = "oikonomia-mint"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Offline license minting for Oikonomia. Run only on an operator machine; the secret key never leaves it."
# Never published to crates.io; deny.toml's [licenses.private] relies on this
# field (a proprietary license-file, not an SPDX id, so cargo-deny cannot
# classify it).
publish = false

[dependencies]
oikonomia-core = { workspace = true }
# rand_core is not on by default at the workspace level (the core crate's
# workspace_pins_ed25519_dalek_v2 test text-parses a plain-string entry); add
# it here so SigningKey::generate is available for offline keygen.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
