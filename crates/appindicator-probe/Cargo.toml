[package]
name = "appindicator-probe"
version.workspace = true
description = "Checks that the Linux appindicator library loads before the tray needs it"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed as an application, not as a crates.io library.
publish = false

[dependencies]
thiserror = { workspace = true }

# Exact: the release libappindicator-sys 0.9.0 loads the library with, so the
# probe opens it the same way (`RTLD_LAZY | RTLD_LOCAL`). It is already in the
# lock file, so no crate is added.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.7.4"

# The workspace lint set, copied because a crate cannot inherit it and change
# one level: the workspace forbids `unsafe` code, and this crate holds one
# audited exception (opening a shared library) behind a safe function. Here
# the lint is `deny`, which the block's reasoned `#[expect]` can lift;
# `forbid` cannot be lifted. Keep the rest in step with `[workspace.lints]`
# in the root manifest.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
string_slice = "warn"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
mod_module_files = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
