[package]
name = "macos-dock-icon"
version.workspace = true
description = "Runtime Dock icon for unbundled (dev-mode) macOS binaries"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license-file.workspace = true
# Never published to crates.io; deny.toml's [licenses.private] relies on this
# field (a proprietary license-file, not an SPDX id, so cargo-deny cannot
# classify it).
publish = false

# This crate deliberately does NOT inherit the workspace lints: the workspace
# forbids `unsafe` code, and this crate exists to hold the single audited
# exception (one AppKit setter call) behind a safe function. Keeping it here
# means every other crate still carries the workspace-wide guarantee.

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
