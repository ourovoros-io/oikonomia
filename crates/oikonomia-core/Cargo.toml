lopdf = { workspace = true }
rand = { workspace = true }
rten = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
