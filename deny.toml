# cargo-deny policy: Oikonomia never connects to the network, so no crate
# that can open a socket may reach the desktop binaries. `cargo deny check`
# runs in CI; run it locally after touching any Cargo.toml.

[graph]
# Tauri pulls reqwest for Android and iOS only. Evaluating just the desktop
# targets keeps that edge out of the graph so the ban below can hold.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Tauri 2 still depends on the unmaintained gtk-rs 0.18 family on Linux;
# only fail on unmaintained crates the workspace depends on directly.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Everything in the graph today; extend deliberately, never with a wildcard.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "reqwest", reason = "Oikonomia never connects to the network" },
    { crate = "ureq", reason = "offline only" },
    { crate = "isahc", reason = "offline only" },
    { crate = "attohttpc", reason = "offline only" },
    { crate = "minreq", reason = "offline only" },
    { crate = "curl", reason = "offline only" },
    { crate = "curl-sys", reason = "offline only" },
    { crate = "hyper", reason = "offline only" },
    { crate = "hyper-util", reason = "offline only" },
    { crate = "h2", reason = "offline only" },
    { crate = "tungstenite", reason = "offline only" },
    { crate = "tokio-tungstenite", reason = "offline only" },
    { crate = "socket2", reason = "offline only: no socket stack" },
    { crate = "mio", reason = "offline only: no socket stack" },
    { crate = "rustls", reason = "offline only: no TLS client" },
    { crate = "native-tls", reason = "offline only: no TLS client" },
    { crate = "tauri-plugin-http", reason = "offline only" },
    { crate = "tauri-plugin-updater", reason = "no in-app updater" },
    { crate = "tauri-plugin-websocket", reason = "offline only" },
    { crate = "tauri-plugin-shell", reason = "the webview must not spawn processes or open URLs" },
    { crate = "tauri-plugin-opener", reason = "the webview must not open URLs" },
    { crate = "tauri-plugin-deep-link", reason = "no URL handlers" },
]
features = [
    { crate = "tokio", deny = ["net"], reason = "no socket stack" },
]
