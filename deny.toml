# Oikonomia's network policy: network crates are banned everywhere except the
# user-initiated update path (ureq under oikonomia-update).
# The core subtree stays fully offline (scripts/assert-core-offline.sh enforces it).
# cargo deny check runs in CI.

[graph]
# Tauri pulls reqwest for Android and iOS only. Evaluating just the desktop
# targets keeps mobile-only network edges out of the graph, so scoped bans hold.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Tauri 2 still depends on the unmaintained gtk-rs 0.18 family on Linux;
# only fail on unmaintained crates the workspace depends on directly.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Everything in the graph today; extend deliberately, never with a wildcard.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Workspace crates are GPL-3.0-or-later and `publish = false`. Ignoring them
# here keeps GPL out of the dependency allow list above: every dependency
# must stay permissive or MPL-2.0, all of which are GPL-3.0 compatible.
ignore = true

[bans]
multiple-versions = "allow"
# A `*` requirement accepts any future release of a crate. The workspace's
# own path dependencies carry no version, which counts as a wildcard, so
# those are let through.
wildcards = "deny"
allow-wildcard-paths = true
# Network crates are banned everywhere EXCEPT the user-initiated update path.
# `wrappers` = the only crates allowed to depend on the banned crate directly.
# Never widen a wrapper list for a non-updater parent; oikonomia-core stays
# fully offline (scripts/assert-core-offline.sh enforces the subtree).
deny = [
    { crate = "reqwest", reason = "the update client uses ureq; nothing else may speak HTTP" },
    { crate = "ureq", wrappers = ["oikonomia-update"], reason = "network only inside the click-driven update client" },
    { crate = "isahc", reason = "offline except the update path" },
    { crate = "attohttpc", reason = "offline except the update path" },
    { crate = "minreq", reason = "offline except the update path" },
    { crate = "curl", reason = "offline except the update path" },
    { crate = "curl-sys", reason = "offline except the update path" },
    { crate = "hyper", wrappers = ["hyper-util", "httptest"], reason = "test server for the update client only" },
    { crate = "hyper-util", wrappers = ["httptest"], reason = "test server for the update client only" },
    { crate = "h2", wrappers = ["hyper"], reason = "test server for the update client only" },
    { crate = "tungstenite", reason = "no websockets" },
    { crate = "tokio-tungstenite", reason = "no websockets" },
    { crate = "socket2", wrappers = ["tokio"], reason = "sockets only under the Tauri runtime" },
    { crate = "mio", wrappers = ["tokio"], reason = "sockets only under the Tauri runtime" },
    { crate = "rustls", wrappers = ["ureq"], reason = "TLS only on the update path" },
    { crate = "native-tls", reason = "rustls only" },
    { crate = "tauri-plugin-http", reason = "the webview gets no HTTP" },
    { crate = "tauri-plugin-websocket", reason = "offline only" },
    { crate = "tauri-plugin-shell", reason = "the webview must not spawn processes" },
    { crate = "tauri-plugin-deep-link", reason = "no URL handlers" },
]
