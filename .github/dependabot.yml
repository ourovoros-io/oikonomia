# Keeps the SHA-pinned Actions, Cargo and npm dependencies current so a pin
# never quietly ages into a known-vulnerable version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # ocrs and rten have to stay on the same rten version because ocr.rs
    # hands our rten::Model to ocrs; bump them together manually.
    ignore:
      - dependency-name: "rten"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      ocr:
        patterns:
          - "ocrs"
          - "rten*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
