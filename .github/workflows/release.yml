# Build a draft GitHub Release from a version tag.
#
# The macos job builds, signs, and notarizes the Apple Silicon app, checks
# the signature with codesign, spctl and stapler, and notarizes and staples
# the disk image; any failed check fails the release. The linux
# job builds the .deb and the AppImage and smoke-tests both. The windows job
# builds the NSIS installer, checks its updater signature against the app's
# public key, and smoke-tests it. It is not Authenticode-signed: that needs
# the repository variable WINDOWS_SIGNING=none, a deliberate opt-in checked
# before anything is built (see scripts/require-windows-signing-mode.sh).
# Every job adds to the same draft; the jobs run one after another so they
# cannot race to create it.
#
# Trigger: version tags `v*` (e.g. v0.1.0). Optional workflow_dispatch with
# dry_run still requires the GitHub Environment named `release` and never
# runs on pull_request. Ordinary PR CI stays in ci.yml (secret-free).
#
# YAML cannot create Environments. Owner must create `release` in
# GitHub → Settings → Environments, add required reviewers, then add
# secrets after the Apple Developer account exists. The updater minisign
# private key (TAURI_SIGNING_PRIVATE_KEY) also lives there.
#
# ---------------------------------------------------------------------------
# Environment `release` secret *names* (values go in the GitHub UI only)
# ---------------------------------------------------------------------------
#
# Apple — Developer ID Application (outside the App Store) + notarytool via
# an App Store Connect Team API key. Official Tauri v2 env names:
# https://v2.tauri.app/reference/environment-variables/
# https://v2.tauri.app/distribute/sign/macos/
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_SIGNING_IDENTITY      e.g. Developer ID Application: Name (TEAMID)
#   APPLE_TEAM_ID               10-character Apple Team ID
#   APPLE_API_ISSUER            App Store Connect Issuer ID (UUID)
#   APPLE_API_KEY               App Store Connect Key ID (Tauri name; NOT the .p8 body)
#   APPLE_API_KEY_ID            same Key ID (accepted alias if APPLE_API_KEY is unset)
#   APPLE_API_KEY_P8            contents of AuthKey_<id>.p8; written to a runner
#                               file and exposed as APPLE_API_KEY_PATH (never commit)
#
# Linux — no signing account; .deb + .AppImage carry the updater minisign
# signature only. The AppImage updates in-app; the .deb is a manual download.
#
# Windows — no Authenticode certificate yet. Shipping without one is opt-in:
# the repository variable (not a secret) WINDOWS_SIGNING must be exactly
# `none`, or the run fails before the first build. The installer carries the
# updater minisign signature, which the in-app update verifies, but Windows
# itself shows its unknown-publisher warning on a first install.
#
# Tauri updater (minisign), required by both jobs.
# Official Tauri v2 env names:
# https://v2.tauri.app/plugin/updater/
#
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  optional password for that key
#
# The updater minisign private key lives on Environment `release` only. The
# public key baked into the app is the trust root; GitHub Releases only hosts
# the files.
# Jobs fail closed if TAURI_SIGNING_PRIVATE_KEY is empty (never echo it).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without attaching a GitHub Release (still uses the release environment)
        type: boolean
        default: false

# Read-only by default. Only the three build jobs, which attach binaries to
# the tag's draft release, widen this to `contents: write`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Empty on dry_run or non-tag runs: tauri-action then skips Release upload.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && inputs.dry_run != true && github.ref_name || '' }}

jobs:
  # Before any approval-gated, hour-long build: a release that cannot ship
  # its Windows installer must say so now, not after macOS and Linux are on
  # the draft. Reads the repository variable only; no environment, no
  # secrets, read-only token.
  windows-signing-mode:
    name: windows signing mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a deliberate Windows signing mode (fail-closed)
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: bash ./scripts/require-windows-signing-mode.sh

  macos:
    name: macos
    needs: windows-signing-mode
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write # creates the draft release and uploads to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Apple signing and notarytool secrets (fail-closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          [ -z "${APPLE_CERTIFICATE}" ] && missing+=(APPLE_CERTIFICATE)
          [ -z "${APPLE_CERTIFICATE_PASSWORD}" ] && missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ -z "${APPLE_SIGNING_IDENTITY}" ] && missing+=(APPLE_SIGNING_IDENTITY)
          [ -z "${APPLE_TEAM_ID}" ] && missing+=(APPLE_TEAM_ID)
          [ -z "${APPLE_API_ISSUER}" ] && missing+=(APPLE_API_ISSUER)
          [ -z "${APPLE_API_KEY}" ] && [ -z "${APPLE_API_KEY_ID}" ] && missing+=("APPLE_API_KEY or APPLE_API_KEY_ID")
          [ -z "${APPLE_API_KEY_P8}" ] && missing+=(APPLE_API_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required release environment secrets: ${missing[*]}"
            echo "Refusing to publish an unsigned macOS build as if it were signed."
            echo "Add the Apple secret names listed at the top of this workflow to Environment 'release'."
            exit 1
          fi

      - name: Require Tauri updater signing private key (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      # Tauri reads APPLE_API_KEY as the Key ID and APPLE_API_KEY_PATH as the .p8 file.
      - name: Materialize App Store Connect API key on the runner
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_id="${APPLE_API_KEY_ID:-${APPLE_API_KEY}}"
          key_dir="${RUNNER_TEMP}/private_keys"
          mkdir -p "${key_dir}"
          key_path="${key_dir}/AuthKey_${key_id}.p8"
          umask 077
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_path}"
          echo "APPLE_API_KEY=${key_id}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # rust-toolchain.toml names the exact toolchain; with no toolchain
      # argument rustup installs that one. No build cache in this workflow,
      # for npm or cargo: a cache entry written by another run must not be
      # able to reach a signed installer.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # Official Tauri v2 action. projectPath is the crate that owns tauri.conf.json.
      # beforeBuildCommand already runs `npm run build` in web/ (no web/dist placeholder).
      # Signing/notarization use the env vars below when secrets exist; this job
      # never reaches here if they are missing.
      # tauriScript is set in every job: projectPath has no package.json, and
      # without it the action runs `npm install -g @tauri-apps/cli@v2`, so an
      # unpinned CLI would build the release and hold the signing keys. This
      # is the CLI `npm ci` installed from web/package-lock.json. Everything
      # after `--` in args goes to cargo.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          tauriScript: node ${{ github.workspace }}/web/node_modules/@tauri-apps/cli/tauri.js
          args: -- --locked

      # Tauri notarizes and staples the .app and signs the .dmg with the same
      # identity, but does not notarize the .dmg. This step proves the app is
      # Developer ID signed by this team, hardened, notarized and stapled, then
      # notarizes and staples the .dmg and replaces the copy tauri-action put
      # on the draft. Any failed check fails the job, so an unsigned or
      # unnotarized Mac build never stays on a draft that looks complete.
      - name: Verify app signature, notarize and staple the disk image (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          bundle="target/release/bundle"
          app="${bundle}/macos/Oikonomia.app"
          shopt -s nullglob
          dmgs=("${bundle}"/dmg/*.dmg)
          if [ ! -d "${app}" ]; then
            echo "::error::${app} is missing"
            exit 1
          fi
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected one .dmg in ${bundle}/dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"

          # The app.
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --display --verbose=2 "${app}" 2> app-signature.txt
          cat app-signature.txt
          if ! grep -q '^Authority=Developer ID Application: ' app-signature.txt; then
            echo "::error::the app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! grep -Fqx "TeamIdentifier=${APPLE_TEAM_ID}" app-signature.txt; then
            echo "::error::the app is not signed by team APPLE_TEAM_ID"
            exit 1
          fi
          if ! grep -q '^CodeDirectory .*flags=.*runtime' app-signature.txt; then
            echo "::error::the app is not signed with the hardened runtime"
            exit 1
          fi
          spctl --assess --type exec --verbose=2 "${app}" 2>&1 | tee app-gatekeeper.txt
          if ! grep -q 'source=Notarized Developer ID' app-gatekeeper.txt; then
            echo "::error::Gatekeeper does not see the app as notarized"
            exit 1
          fi
          xcrun stapler validate "${app}"

          # The disk image.
          codesign --verify --strict --verbose=2 "${dmg}"
          if ! xcrun notarytool submit "${dmg}" \
              --key "${APPLE_API_KEY_PATH}" \
              --key-id "${APPLE_API_KEY}" \
              --issuer "${APPLE_API_ISSUER}" \
              --wait --timeout 1h --output-format json > notary.json; then
            cat notary.json
            echo "::error::notarytool could not notarize ${dmg}"
            exit 1
          fi
          cat notary.json
          status="$(python3 -c 'import json; print(json.load(open("notary.json")).get("status", ""))')"
          if [ "${status}" != "Accepted" ]; then
            echo "::error::notarization of ${dmg} ended '${status}', not 'Accepted'"
            exit 1
          fi
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}" 2>&1 | tee dmg-gatekeeper.txt
          if ! grep -q 'source=Notarized Developer ID' dmg-gatekeeper.txt; then
            echo "::error::Gatekeeper does not see the disk image as notarized"
            exit 1
          fi

          # Replace the unstapled disk image on the draft. Refuse if the draft
          # holds it under another name: promotion would publish the old one.
          if [ -n "${RELEASE_TAG}" ]; then
            name="$(basename "${dmg}")"
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' > draft-assets.txt
            if ! grep -Fqx -- "${name}" draft-assets.txt; then
              echo "::error::the draft for ${RELEASE_TAG} has no asset named ${name}"
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" "${dmg}" --repo "${GITHUB_REPOSITORY}" --clobber
          fi

      - name: Smoke-test the bundled app
        run: SMOKE_SKIP_BUILD=1 ./scripts/smoke-macos.sh

  linux:
    name: linux
    # After macos, so the two jobs cannot race to create the draft release and
    # leave two drafts for one tag (promotion would then refuse to run).
    needs: macos
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write # uploads to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Tauri updater signing private key (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      # Same Debian packages as ci.yml, plus patchelf/xdg-utils/libfuse2 for
      # Tauri's default Linux bundles (.deb + AppImage). perl is required by
      # the vendored OpenSSL build from rusqlite's sqlcipher feature.
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Install the smoke-test desktop (virtual display, window manager)
        run: |
          sudo apt-get install -y \
            xvfb \
            openbox \
            xdotool \
            wmctrl \
            imagemagick \
            dbus-x11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # --bundles deb,appimage attaches .deb for manual download. tauri-action
      # latest.json Linux target is AppImage only (no .deb updater URL).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          tauriScript: node ${{ github.workspace }}/web/node_modules/@tauri-apps/cli/tauri.js
          args: --bundles deb,appimage -- --locked

      - name: Smoke-test the bundled app
        timeout-minutes: 15
        run: ./scripts/smoke-linux.sh

  windows:
    name: windows
    # After linux, for the same reason linux runs after macos: one draft.
    needs: linux
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write # uploads to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked again here: an Environment `release` variable of the same
      # name overrides the repository one inside this job.
      - name: Require a deliberate Windows signing mode (fail-closed)
        shell: bash
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: bash ./scripts/require-windows-signing-mode.sh

      - name: Require Tauri updater signing private key (fail-closed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # NSIS only: the update path and the Promote workflow know no MSI.
      # No bundle.windows.certificateThumbprint or signCommand is configured,
      # so Tauri does no Authenticode signing (WINDOWS_SIGNING=none). It
      # still signs the installer for the updater with the minisign key
      # below (bundle.createUpdaterArtifacts) and uploads the .sig.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          tauriScript: node ${{ github.workspace }}/web/node_modules/@tauri-apps/cli/tauri.js
          args: --bundles nsis -- --locked

      # The installer is the Windows updater artifact: the app downloads it,
      # checks its sha256 and this .sig against the baked public key, then
      # runs it. Prove here that the .sig exists and verifies with that key,
      # so a draft never holds a Windows build the app would refuse.
      # PowerShell, not bash, for the same Strawberry Perl reason as ci.yml.
      - name: Verify the installer's updater signature with the app's public key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            Write-Host "::error::expected one NSIS installer in target/release/bundle/nsis, found $($installers.Count)"
            exit 1
          }
          $installer = $installers[0].FullName
          $sig = "$installer.sig"
          if (-not (Test-Path $sig) -or (Get-Item $sig).Length -eq 0) {
            Write-Host "::error::$sig is missing or empty; the app could not verify this installer"
            exit 1
          }
          $pubkey = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- verify --manifest $installer --sig $sig --pubkey $pubkey
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the updater signature of $installer does not verify with plugins.updater.pubkey"
            exit 1
          }
          $authenticode = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Updater signature ok. Authenticode status: $($authenticode.Status) (expected NotSigned with WINDOWS_SIGNING=none)"

      - name: Smoke-test the bundled app
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/smoke-windows.ps1
