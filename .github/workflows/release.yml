# Build a draft GitHub Release from a version tag.
#
# The macos job builds, signs, and notarizes the Apple Silicon app. The linux
# job builds the .deb and the AppImage and smoke-tests both. The windows job
# builds the NSIS installer and smoke-tests it; it is not code-signed yet, so
# the Promote workflow withholds it from the published release unless asked.
# Every job adds to the same draft; the jobs run one after another so they
# cannot race to create it.
#
# Trigger: version tags `v*` (e.g. v0.1.0). Optional workflow_dispatch with
# dry_run still requires the GitHub Environment named `release` and never
# runs on pull_request. Ordinary PR CI stays in ci.yml (secret-free).
#
# YAML cannot create Environments. Owner must create `release` in
# GitHub → Settings → Environments, add required reviewers, then add
# secrets after the Apple Developer account exists. The updater minisign
# private key (TAURI_SIGNING_PRIVATE_KEY) also lives there.
#
# ---------------------------------------------------------------------------
# Environment `release` secret *names* (values go in the GitHub UI only)
# ---------------------------------------------------------------------------
#
# Apple — Developer ID Application (outside the App Store) + notarytool via
# an App Store Connect Team API key. Official Tauri v2 env names:
# https://v2.tauri.app/reference/environment-variables/
# https://v2.tauri.app/distribute/sign/macos/
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_SIGNING_IDENTITY      e.g. Developer ID Application: Name (TEAMID)
#   APPLE_TEAM_ID               10-character Apple Team ID
#   APPLE_API_ISSUER            App Store Connect Issuer ID (UUID)
#   APPLE_API_KEY               App Store Connect Key ID (Tauri name; NOT the .p8 body)
#   APPLE_API_KEY_ID            same Key ID (accepted alias if APPLE_API_KEY is unset)
#   APPLE_API_KEY_P8            contents of AuthKey_<id>.p8; written to a runner
#                               file and exposed as APPLE_API_KEY_PATH (never commit)
#
# Linux — no signing account; .deb + .AppImage carry the updater minisign
# signature only. The AppImage updates in-app; the .deb is a manual download.
#
# Windows — no code-signing certificate yet. The installer carries the updater
# minisign signature, which the in-app update verifies, but Windows itself
# shows its unknown-publisher warning on a first install.
#
# Tauri updater (minisign), required by both jobs.
# Official Tauri v2 env names:
# https://v2.tauri.app/plugin/updater/
#
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  optional password for that key
#
# The updater minisign private key lives on Environment `release` only. The
# public key baked into the app is the trust root; GitHub Releases only hosts
# the files.
# Jobs fail closed if TAURI_SIGNING_PRIVATE_KEY is empty (never echo it).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without attaching a GitHub Release (still uses the release environment)
        type: boolean
        default: false

# Attach binaries to the tag's GitHub Release. Not used on pull_request.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Empty on dry_run or non-tag runs: tauri-action then skips Release upload.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && inputs.dry_run != true && github.ref_name || '' }}

jobs:
  macos:
    name: macos
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Apple signing and notarytool secrets (fail-closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          [ -z "${APPLE_CERTIFICATE}" ] && missing+=(APPLE_CERTIFICATE)
          [ -z "${APPLE_CERTIFICATE_PASSWORD}" ] && missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ -z "${APPLE_SIGNING_IDENTITY}" ] && missing+=(APPLE_SIGNING_IDENTITY)
          [ -z "${APPLE_TEAM_ID}" ] && missing+=(APPLE_TEAM_ID)
          [ -z "${APPLE_API_ISSUER}" ] && missing+=(APPLE_API_ISSUER)
          [ -z "${APPLE_API_KEY}" ] && [ -z "${APPLE_API_KEY_ID}" ] && missing+=("APPLE_API_KEY or APPLE_API_KEY_ID")
          [ -z "${APPLE_API_KEY_P8}" ] && missing+=(APPLE_API_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required release environment secrets: ${missing[*]}"
            echo "Refusing to publish an unsigned macOS build as if it were signed."
            echo "Add the Apple secret names listed at the top of this workflow to Environment 'release'."
            exit 1
          fi

      - name: Require Tauri updater signing private key (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      # Tauri reads APPLE_API_KEY as the Key ID and APPLE_API_KEY_PATH as the .p8 file.
      - name: Materialize App Store Connect API key on the runner
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_id="${APPLE_API_KEY_ID:-${APPLE_API_KEY}}"
          key_dir="${RUNNER_TEMP}/private_keys"
          mkdir -p "${key_dir}"
          key_path="${key_dir}/AuthKey_${key_id}.p8"
          umask 077
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_path}"
          echo "APPLE_API_KEY=${key_id}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Official Tauri v2 action. projectPath is the crate that owns tauri.conf.json.
      # beforeBuildCommand already runs `npm run build` in web/ (no web/dist placeholder).
      # Signing/notarization use the env vars below when secrets exist; this job
      # never reaches here if they are missing.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true

      - name: Smoke-test the bundled app
        run: SMOKE_SKIP_BUILD=1 ./scripts/smoke-macos.sh

  linux:
    name: linux
    # After macos, so the two jobs cannot race to create the draft release and
    # leave two drafts for one tag (promotion would then refuse to run).
    needs: macos
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Tauri updater signing private key (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      # Same Debian packages as ci.yml, plus patchelf/xdg-utils/libfuse2 for
      # Tauri's default Linux bundles (.deb + AppImage). perl is required by
      # the vendored OpenSSL build from rusqlite's sqlcipher feature.
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Install the smoke-test desktop (virtual display, window manager)
        run: |
          sudo apt-get install -y \
            xvfb \
            openbox \
            xdotool \
            wmctrl \
            imagemagick \
            dbus-x11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # --bundles deb,appimage attaches .deb for manual download. tauri-action
      # latest.json Linux target is AppImage only (no .deb updater URL).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          args: --bundles deb,appimage

      - name: Smoke-test the bundled app
        run: ./scripts/smoke-linux.sh

  windows:
    name: windows
    # After linux, for the same reason linux runs after macos: one draft.
    needs: linux
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Tauri updater signing private key (fail-closed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required release environment secret: TAURI_SIGNING_PRIVATE_KEY"
            echo "Refusing to publish updater JSON without a signing key."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to Environment 'release'."
            echo "This is the updater minisign key."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # NSIS only: the update path and the Promote workflow know no MSI.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && format('Oikonomia {0}', env.RELEASE_TAG) || '' }}
          releaseBody: Draft build. Test it, then run the Promote workflow to publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          args: --bundles nsis

      - name: Smoke-test the bundled app
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
