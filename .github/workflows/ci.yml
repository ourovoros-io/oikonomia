name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Package list from https://v2.tauri.app/start/prerequisites/ (Debian/Ubuntu).
      # perl is required by the vendored OpenSSL build pulled in via rusqlite's
      # bundled-sqlcipher-vendored-openssl feature.
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build requires the frontendDist directory (web/dist) to exist at
      # compile time; CI compiles the shell crate without bundling a frontend.
      - name: Create frontend dist placeholder
        run: mkdir -p web/dist

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test -p oikonomia-core

      - run: cargo build -p oikonomia

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx tsc -b

      - run: npm test

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-audit --locked

      # Blocking by design: cargo audit exits nonzero only for actual
      # vulnerabilities; unmaintained-crate warnings do not fail the job.
      - run: cargo audit
