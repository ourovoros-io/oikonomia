name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    # Every published platform lints, tests and builds on its own runner: the
    # platform-specific code (vault file modes, tray, update install) is
    # compiled out everywhere else, so one runner cannot vouch for another.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung GUI or installer must fail the job, not hold a runner for hours.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed machine gate: the updater public key must be baked before
      # CI can go green. Empty/whitespace is not a skip. This is not a private
      # key.
      - name: Require baked updater public key (fail-closed)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          import sys

          path = "apps/desktop/src-tauri/tauri.conf.json"
          with open(path, encoding="utf-8") as handle:
              config = json.load(handle)
          plugins = config.get("plugins")
          updater = plugins.get("updater") if isinstance(plugins, dict) else None
          pubkey = updater.get("pubkey") if isinstance(updater, dict) else None
          if not isinstance(pubkey, str) or not pubkey.strip():
              print(
                  "::error::plugins.updater.pubkey is missing or empty in tauri.conf.json"
              )
              print("Refusing to pass CI without a baked updater public key.")
              print("Do not invent a key here; bake the real minisign public key.")
              sys.exit(1)
          PY

      # Package list from https://v2.tauri.app/start/prerequisites/ (Debian/Ubuntu).
      # perl is required by the vendored OpenSSL build pulled in via rusqlite's
      # bundled-sqlcipher-vendored-openssl feature.
      - name: Install Tauri v2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl

      # rust-toolchain.toml names the exact toolchain and its components; with
      # no toolchain argument rustup installs that one, so no workflow repeats
      # the version.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      # The cargo steps below keep each runner's default shell on purpose. On
      # Windows that is PowerShell, which finds Strawberry Perl; Git Bash would
      # put its own perl first, and that perl lacks the modules the vendored
      # OpenSSL build (SQLCipher) needs.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # tauri-build requires the frontendDist directory (web/dist) to exist at
      # compile time; CI compiles the shell crate without bundling a frontend.
      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p web/dist

      # Formatting does not depend on the platform; one runner is enough.
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo test --workspace --locked --lib --bins --tests

      # Doctests run without the desktop crate (it has none). With it in the
      # build, cargo hands every doctest the link search path of its build
      # script, where tauri-build leaves an empty msvcrt.lib for the static C
      # runtime, and the doctests of the other crates then fail to link on
      # Windows.
      - run: cargo test --workspace --exclude oikonomia --locked --doc

      - run: cargo build -p oikonomia --locked

      # The workspace test above builds oikonomia-update without this feature,
      # so the debug-feed tests never run there. Linux is enough: the feature
      # is not platform-specific.
      - name: Test the update crate with the debug feed
        if: runner.os == 'Linux'
        run: cargo test -p oikonomia-update --features debug-feed --locked

      # The desktop package exposes debug-feed and forwards it to
      # oikonomia-update, which is what puts the variable's name in the binary.
      # A missing binary also exits non-zero, so this step passes only when
      # stderr has the script's line for a binary that contains the name.
      - name: Require the debug-feed check to reject a debug-feed binary
        if: runner.os == 'Linux'
        run: |
          cargo build -p oikonomia --features debug-feed --locked
          status=0
          err=$(scripts/assert-no-debug-feed.sh target/debug/oikonomia 2>&1 >/dev/null) || status=$?
          printf '%s\n' "$err" >&2
          expected='::error::target/debug/oikonomia contains OIKONOMIA_UPDATE_FEED: the debug feed override was built into a release'
          if [ "$status" -eq 0 ] || ! printf '%s\n' "$err" | grep -F -q "$expected"; then
            echo 'debug-feed check did not reject the binary for containing OIKONOMIA_UPDATE_FEED' >&2
            exit 1
          fi

  # Rustdoc warnings are errors: a broken intra-doc link fails here instead of
  # shipping a dead reference in the API docs. Private items are documented
  # too, because most of the workspace's docs are on private items and a
  # link in them is checked only when they are built.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Documenting the desktop crate compiles its dependencies' build
      # scripts, which probe for the same system libraries as a build.
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Create frontend dist placeholder
        run: mkdir -p web/dist

      - run: cargo doc --workspace --no-deps --document-private-items --locked

  # Early warning only. Beta becomes stable within six weeks, so a lint that
  # fails here is one the next toolchain bump will have to fix. It must not
  # block a merge: continue-on-error keeps the run green while this job shows
  # red, and the job must not be made a required status check.
  clippy-beta:
    name: clippy (beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      # Overrides rust-toolchain.toml for every step, the cache key included.
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl

      - name: Install the beta toolchain
        run: rustup toolchain install beta --profile minimal --component clippy --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Create frontend dist placeholder
        run: mkdir -p web/dist

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Builds the real installers: the .deb and AppImage on Linux, the NSIS
  # installer on Windows. Windows runs its installer here; the Linux ones run
  # in `smoke-linux` on clean machines. The Mac .app is built and smoked in
  # `smoke-macos`. Unit tests cannot see a blank webview, a second process on
  # the same vault, or a window that never comes back.
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 on purpose: the AppImage and .deb then run on every newer glibc.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung GUI or installer must fail the job, not hold a runner for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri v2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Pull requests have no updater signing key, so the bundles are built
      # without updater signatures. The release workflow signs the real ones.
      # Each runner builds in its default shell: on Windows that is
      # PowerShell, which finds Strawberry Perl for the vendored OpenSSL
      # build; Git Bash would put its own, incomplete perl first.
      # The Tauri CLI is the one `npm ci` installed from web/package-lock.json,
      # started through node so one command line works in both shells.
      # Everything after `--` goes to cargo.
      - name: Build the installers (Linux)
        if: runner.os == 'Linux'
        run: |
          printf '{"bundle": {"createUpdaterArtifacts": false}}' > "${RUNNER_TEMP}/smoke-config.json"
          node web/node_modules/@tauri-apps/cli/tauri.js build --bundles deb,appimage --config "${RUNNER_TEMP}/smoke-config.json" -- --locked

      # Same path release.yml checks. The bundle is unsigned, but it is the
      # release binary, and a missing file fails the script.
      - name: Reject a release binary with the debug feed override (Linux)
        if: runner.os == 'Linux'
        run: scripts/assert-no-debug-feed.sh target/release/oikonomia

      # The bundler's own fetch has no retry and no integrity check.
      - name: Fetch the WebView2 bootstrapper (retried, signature-checked)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'MicrosoftEdgeWebview2Setup.exe'
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $exe
              break
            }
            catch {
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (10 * $i)
            }
          }
          $sig = Get-AuthenticodeSignature -FilePath $exe
          if ($null -eq $sig.SignerCertificate) {
            Remove-Item $exe -Force
            Write-Host "::error::WebView2 bootstrapper signature $($sig.Status); signer certificate missing"
            exit 1
          }
          $signerCn = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          $issuerCn = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $true)
          $issuerOk = $issuerCn.StartsWith('Microsoft Code Signing PCA') -or $issuerCn.StartsWith('Microsoft Windows Code Signing PCA')
          if ($sig.Status -ne 'Valid' -or $signerCn -cne 'Microsoft Corporation' -or -not $issuerOk) {
            Remove-Item $exe -Force
            Write-Host "::error::WebView2 bootstrapper signature $($sig.Status); signer CN '$signerCn'; issuer CN '$issuerCn'"
            exit 1
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
          Write-Host "WebView2 bootstrapper ok: $((Get-Item $exe).Length) bytes, signer CN $signerCn, issuer CN $issuerCn, thumbprint $($sig.SignerCertificate.Thumbprint), sha256 $sha256"

      - name: Build the installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'smoke-config.json'
          '{"bundle": {"createUpdaterArtifacts": false}}' | Set-Content -Path $config -Encoding ascii
          node web/node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config $config -- --locked

      # Same path release.yml checks, including the .exe suffix. Bash, because
      # the job's default shell on Windows is PowerShell.
      - name: Reject a release binary with the debug feed override (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/assert-no-debug-feed.sh target/release/oikonomia.exe

      - name: Smoke-test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1

      - name: Keep the Windows screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-windows
          path: target/smoke
          if-no-files-found: warn

      - name: Hand the Linux installers to the smoke job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3

  # Runs the Linux installers on machines that did not build them. The build
  # machine has every development package installed, so it cannot show a
  # dependency the .deb forgot to declare or a library the AppImage failed to
  # bundle. 24.04 also proves a build made on 22.04 runs on a newer release.
  smoke-linux:
    name: smoke (${{ matrix.os }})
    needs: bundle
    # `bundle` is a matrix; a red Windows leg must not skip the Linux smoke.
    # If the Linux leg itself failed, the download step below fails instead.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # A hung GUI or installer must fail the job, not hold a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-installers
          path: target/release/bundle

      - name: Install the smoke-test desktop (virtual display, window manager)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            openbox \
            xdotool \
            wmctrl \
            imagemagick \
            dbus-x11

      - name: Smoke-test the installed app
        run: ./scripts/smoke-linux.sh

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.os }}
          path: target/smoke
          if-no-files-found: warn

  # Proves the bundled .app draws a window. This is the check `make smoke`
  # runs (`scripts/smoke-macos.sh`): the Tauri CLI from web/package-lock.json,
  # `--locked` through to cargo, and updater artifacts turned off. A pull
  # request has no Apple signing identity and this job asks for none; the
  # release workflow is what signs and notarizes. A hung window must fail the
  # job, not hold a runner for hours.
  smoke-macos:
    name: smoke (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Smoke-test the bundled app
        run: ./scripts/smoke-macos.sh

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-macos
          path: target/smoke
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx tsc -b

      - run: npm run lint

      - run: npm test

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Exact versions: a gate tool must not change under a pull request.
      # Dependabot does not see these; bump them by hand.
      - run: cargo install cargo-audit@0.22.2 cargo-deny@0.20.2 --locked

      # Blocking by design: cargo audit exits nonzero only for actual
      # vulnerabilities; unmaintained-crate warnings do not fail the job.
      - run: cargo audit

      # deny.toml confines network crates to the click-driven update path.
      - run: cargo deny check

      # The wrappers in deny.toml allow network crates under the updater;
      # core's own subtree must stay at zero.
      - run: ./scripts/assert-core-offline.sh

  # The workflows hold the signing and publishing lanes, so they are linted
  # like code: actionlint for syntax and shell, zizmor for security findings.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release binaries at exact versions, checked against the sha256 each
      # release publishes for its asset. Dependabot does not see these; bump
      # the version and the hash together, by hand.
      - name: Install actionlint and zizmor
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/workflow-lint"
          mkdir -p "${tools}"
          cd "${tools}"
          curl --proto '=https' --tlsv1.2 --retry 3 -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' \
            "${ACTIONLINT_SHA256}" actionlint.tar.gz \
            "${ZIZMOR_SHA256}" zizmor.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf zizmor.tar.gz
          echo "${tools}" >> "${GITHUB_PATH}"

      - run: actionlint

      # The token lets zizmor ask GitHub about the pinned actions (known
      # vulnerabilities, commits that are not in the action's own history).
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
