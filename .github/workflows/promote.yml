# Promote a draft release in this repo to a published one.
#
# A tag push (release.yml) leaves signed installers in a DRAFT release, which
# neither the public nor the updater can see. This workflow is the gate that
# makes it live. Manual, reviewed, fail-closed. Steps: download the draft's
# artifacts, assemble latest.json ourselves (sha256 + per-artifact minisign
# sigs), refuse any artifact the feed names that is larger than the client
# will download, sign latest.json with the updater minisign key, verify it
# and every artifact it names with the app's baked public key, make the
# version-free copies getoikonomia.app links to,
# write SHA256SUMS, strip every asset outside the tested allow-list, upload
# the signed feed, the checksums and the copies, and only then publish the
# draft.
#
# macOS and Linux are always published. The Windows installer is published
# when `publish_windows` is on (the default), and that requires the
# repository variable WINDOWS_SIGNING to record a deliberate signing choice:
# today only `none` (no Authenticode). Unset or any other value fails the
# run; it never drops Windows quietly. Turning `publish_windows` off is the
# one way to withhold Windows, and it warns that the site's Windows link
# will not resolve. Which file fills which feed entry, and which assets
# survive, is decided by `oikonomia-update`'s `release_set` module, not by
# shell patterns here.
#
# Needs (Environment `release`):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Needs (repository variable, when publishing Windows):
#   WINDOWS_SIGNING=none
name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to promote (e.g. v0.1.0)
        required: true
        type: string
      dry_run:
        description: Assemble, sign, and verify the feed without publishing
        type: boolean
        default: false
      publish_windows:
        description: Publish the Windows installer (needs repository variable WINDOWS_SIGNING=none; turn off only to withhold Windows on purpose)
        type: boolean
        default: true

permissions:
  contents: read

# One promotion per tag. A second run of the same tag waits until the first
# finishes, so a publish in progress always runs through to the end.
concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    # Editing and publishing the release needs write access to this repo's
    # contents; nothing else is granted.
    permissions:
      contents: write
      # Read the Release workflow's result for the tag.
      actions: read
    env:
      TAG: ${{ inputs.tag }}
      PUBLISH_WINDOWS: ${{ inputs.publish_windows }}
      WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sets WINDOWS_FLAG for every later step: `--with-windows` or nothing.
      # Publishing Windows needs both the input and the signing opt-in;
      # withholding it is only ever the result of turning the input off.
      - name: Decide whether Windows is published (fail-closed)
        run: |
          set -euo pipefail
          case "${PUBLISH_WINDOWS}" in
            true)
              bash ./scripts/require-windows-signing-mode.sh
              echo "WINDOWS_FLAG=--with-windows" >> "${GITHUB_ENV}"
              ;;
            false)
              echo "::warning title=Windows withheld::publish_windows is off: this release has no Windows installer and no windows-x86_64 feed entry, and getoikonomia.app/download/windows will not resolve until a release that has one."
              echo "WINDOWS_FLAG=" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "::error::publish_windows is neither true nor false"
              exit 1
              ;;
          esac

      - name: Require promote secrets (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] && missing+=(TAURI_SIGNING_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      # rust-toolchain.toml names the exact toolchain; with no toolchain
      # argument rustup installs that one. This job holds the updater
      # signing key, so cargo and npm build from scratch. A shared cache
      # written by any other workflow could run code next to that key.
      # assemble_feed is small; a cold build is fine.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The signing step needs the Tauri CLI and nothing else from web/. It
      # comes from web/package-lock.json, so the program that is handed the
      # updater key is the reviewed, hash-checked one. No install scripts:
      # the CLI is a prebuilt binary and no other package has a reason to run
      # code in this job.
      - name: Install the pinned Tauri CLI
        working-directory: web
        run: npm ci --ignore-scripts

      # gh resolves draft releases by tag when authenticated with repo access.
      # If this ever stops matching the draft, list releases via
      # `gh api repos/${GITHUB_REPOSITORY}/releases` and download assets by id.
      # Refuse anything that is not a draft: re-running against a published
      # release would rewrite a feed that installed apps already trust.
      - name: Require the release to be a draft (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [ "${is_draft}" != "true" ]; then
            echo "::error::release ${TAG} is not a draft (isDraft=${is_draft}); refusing to promote"
            exit 1
          fi

      # The Release workflow uploads each installer to the draft before it
      # smoke-tests it, so a draft can hold installers whose test failed.
      # Promote only what a fully green Release run produced.
      - name: Require a green Release run for the tag (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The latest run on the tag, whatever started it: a manual run on
          # the tag uploads to the same draft, so a green tag push followed
          # by a red manual run must block too.
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow release.yml \
            --branch "${TAG}" --limit 1 \
            --json conclusion,headSha --jq '.[0] // {} | "\(.conclusion | if . == null or . == "" then "unfinished" else . end) \(.headSha // "none")"' > run.txt
          read -r conclusion run_sha < run.txt
          if [ "${conclusion}" != "success" ]; then
            echo "::error::the latest Release run for ${TAG} is '${conclusion}', not 'success'; refusing to promote"
            exit 1
          fi

          # The run must have built the commit the tag points at now.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha > tag-sha.txt
          tag_sha="$(cat tag-sha.txt)"
          if [ "${run_sha}" != "${tag_sha}" ]; then
            echo "::error::the Release run built ${run_sha}, but ${TAG} is ${tag_sha}; refusing to promote"
            exit 1
          fi

      - name: Download draft release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir artifacts
          ls -la artifacts

      - name: Assemble latest.json
        run: |
          set -euo pipefail
          # tauri-action uploads its own latest.json to the draft; ours is the only one that ships.
          rm -f artifacts/latest.json artifacts/latest.json.sig
          printf '%s' "Oikonomia ${TAG}" > notes.txt
          # Fails when a platform has no artifact or more than one.
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --locked -p oikonomia-update --bin assemble_feed -- assemble \
            --version "${TAG}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --dir artifacts --out artifacts/latest.json --notes-file notes.txt \
            ${WINDOWS_FLAG}
          cat artifacts/latest.json

      # Every URL in the assembled feed is a file an installed copy will
      # download. The release jobs already checked their own bundles; this
      # checks the set that will ship. The binary reads MAX_ARTIFACT_BYTES.
      - name: Reject feed artifacts over the client's download limit
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- check-sizes \
            --manifest artifacts/latest.json --dir artifacts

      # `signer sign` reads the key and its password from these two variables
      # (its --help lists them), so neither is put on the command line, where
      # any process on the runner could read it. An empty password is the
      # same as none.
      - name: Sign latest.json with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node web/node_modules/@tauri-apps/cli/tauri.js signer sign artifacts/latest.json
          test -s artifacts/latest.json.sig

      - name: Verify the signed manifest with the app's baked public key
        run: |
          pubkey="$(python3 -c 'import json;print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')"
          cargo run --locked -p oikonomia-update --bin assemble_feed -- verify \
            --manifest artifacts/latest.json --sig artifacts/latest.json.sig \
            --pubkey "${pubkey}"

      # The app checks each artifact's sha256 and minisign signature before
      # it installs. Make the same check here, against the same baked key,
      # so a release whose installer the app would refuse (a stale or wrongly
      # keyed .sig) is never published. Also proves the feed has exactly the
      # platforms this release publishes, windows-x86_64 included with
      # publish_windows.
      - name: Verify every feed artifact with the app's baked public key
        run: |
          set -euo pipefail
          pubkey="$(python3 -c 'import json;print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')"
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- verify-feed \
            --manifest artifacts/latest.json --dir artifacts --pubkey "${pubkey}" \
            ${WINDOWS_FLAG}

      # Version-free copies for getoikonomia.app, which links to
      # releases/latest/download/<fixed name>. Made only after the feed is
      # signed and verified, so they are copies of exactly the files the feed
      # and the checksums vouch for. Fails if any source is missing or
      # ambiguous. The Windows copy exists only with publish_windows.
      # expected-fixed.txt is the list from release_set; what was made must
      # be exactly that list.
      - name: Make the version-free download copies
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- fixed-names \
            ${WINDOWS_FLAG} > expected-fixed.txt
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- fixed-copies \
            --dir artifacts ${WINDOWS_FLAG} > fixed.txt
          cat fixed.txt
          if ! diff -u expected-fixed.txt fixed.txt; then
            echo "::error::the version-free copies made differ from the ones this release must carry"
            exit 1
          fi
          while IFS= read -r name; do
            test -s "artifacts/${name}" || { echo "::error::artifacts/${name} is missing or empty"; exit 1; }
          done < fixed.txt

      # One line per published file, so anyone can check a download with
      # `sha256sum --check`. Written after the feed is signed so it covers
      # latest.json and its signature too. A withheld Windows installer is
      # not listed.
      - name: Write SHA256SUMS for the published files
        run: |
          set -euo pipefail
          rm -f artifacts/SHA256SUMS
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --locked -p oikonomia-update --bin assemble_feed -- checksums \
            --dir artifacts --out artifacts/SHA256SUMS ${WINDOWS_FLAG}
          cat artifacts/SHA256SUMS
          # Prove the file is in the format people will check it with.
          (cd artifacts && sha256sum --check --strict SHA256SUMS)
          # Every version-free download the site links to must be listed.
          while IFS= read -r name; do
            if ! awk -v name="${name}" '$2 == name { found = 1 } END { exit !found }' artifacts/SHA256SUMS; then
              echo "::error::SHA256SUMS does not list ${name}"
              exit 1
            fi
          done < expected-fixed.txt

      - name: Publish the draft
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ship an explicit allow-list only: delete every draft asset the
          # release set does not publish (a withheld Windows installer, stray
          # formats), so the release holds what the feed names and no more.
          # Each list goes through a file, not a process substitution: a
          # failing command must stop the job here, not leave an empty list
          # that would publish the draft unfiltered.
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > assets.txt
          mapfile -t assets < assets.txt
          # shellcheck disable=SC2086 # WINDOWS_FLAG is one flag or nothing.
          cargo run --quiet --locked -p oikonomia-update --bin assemble_feed -- \
            unpublished ${WINDOWS_FLAG} "${assets[@]}" > removed.txt
          mapfile -t removed < removed.txt

          for asset in "${removed[@]}"; do
            [ -z "${asset}" ] && continue
            gh release delete-asset "${TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
          done

          if [ "${#removed[@]}" -gt 0 ]; then
            echo "::warning::removed assets outside the published release set: ${removed[*]}"
          fi

          # Replace tauri-action's latest.json with the one assembled, signed,
          # and verified above, and add the checksum file and the version-free
          # copies. The draft is still invisible at this point.
          mapfile -t fixed < fixed.txt
          uploads=(artifacts/latest.json artifacts/latest.json.sig artifacts/SHA256SUMS)
          for name in "${fixed[@]}"; do
            uploads+=("artifacts/${name}")
          done
          gh release upload "${TAG}" "${uploads[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber

          # Every file the site links to, and every file the feed names, must
          # be on the draft before it goes public; a missing one would be a
          # dead download link or an update no app can fetch. The lists come
          # from release_set and from the signed feed, not from what was
          # uploaded.
          python3 -c 'import json; [print(p["url"].rsplit("/", 1)[1]) for p in json.load(open("artifacts/latest.json"))["platforms"].values()]' > feed-files.txt
          mapfile -t expected_fixed < expected-fixed.txt
          mapfile -t feed_files < feed-files.txt
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > published.txt
          for name in latest.json latest.json.sig SHA256SUMS "${expected_fixed[@]}" "${feed_files[@]}"; do
            if ! grep -Fqx -- "${name}" published.txt; then
              echo "::error::${name} is not on the draft after upload; refusing to publish"
              exit 1
            fi
          done

          # Last step on purpose: until here nothing is public, so a failure
          # above leaves a draft to fix, never a half-published release.
          notes="Signed release. The app verifies the minisign signature of latest.json and of every artifact before installing."
          if [ -n "${WINDOWS_FLAG}" ] && [ "${WINDOWS_SIGNING}" = "none" ]; then
            notes="${notes} The Windows installer is not Authenticode-signed yet, so Windows shows an unknown-publisher warning on a first install (More info, Run anyway)."
          fi
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest \
            --title "Oikonomia ${TAG}" \
            --notes "${notes}"
