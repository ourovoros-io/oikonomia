[package]
name = "oikonomia"
version.workspace = true
description = "Oikonomia desktop shell (Tauri)"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed as an application, not as a crates.io library.
publish = false

[lib]
name = "oikonomia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
serde_json = { workspace = true }

[dependencies]
oikonomia-core = { workspace = true }
oikonomia-update = { path = "../../../crates/oikonomia-update" }
macos-dock-icon = { path = "../../../crates/macos-dock-icon" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
# macos-private-api: transparent tray quick-add window (rounded corners via CSS).
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
log = "0.4"
thiserror = { workspace = true }

# Windows and Linux start a new process every time the app is launched. A
# second launch must surface the first one's window (which may be hidden in
# the tray) instead of opening the vault twice. macOS already routes a second
# launch to the running app, so it does not need the plugin.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[lints]
workspace = true
