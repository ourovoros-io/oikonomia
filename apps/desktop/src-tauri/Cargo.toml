[package]
name = "oikonomia"
version.workspace = true
description = "Oikonomia desktop shell (Tauri)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "oikonomia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
oikonomia-core = { workspace = true }
macos-dock-icon = { path = "../../../crates/macos-dock-icon" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# macos-private-api: transparent tray quick-add window (rounded corners via CSS).
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
log = "0.4"
thiserror = { workspace = true }

[lints]
workspace = true
